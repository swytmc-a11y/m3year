name: ios-unsigned-ipa

# Manual only — builds an UNSIGNED iOS .ipa (no Apple Developer account or
# certificates involved). Download the artifact and sign it with your own
# external signing tool.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rental/mobile/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        working-directory: rental/mobile
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        working-directory: rental/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      # A stale Metro/babel transform cache can bake `undefined` in place of
      # EXPO_PUBLIC_* values, producing a bundle that throws at module load
      # and hard-aborts the app on launch. Start every build from a clean one.
      - name: Clear bundler caches
        working-directory: rental/mobile
        run: rm -rf node_modules/.cache "$TMPDIR/metro-cache" "$TMPDIR/haste-map-"* 2>/dev/null || true

      - name: Install CocoaPods
        working-directory: rental/mobile/ios
        run: |
          if [ -f Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi

      - name: Resolve workspace and scheme
        id: xc
        working-directory: rental/mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n1)
          # The app scheme matches the generated .xcodeproj name (e.g. mayar),
          # NOT the first scheme xcodebuild -list prints (which is a Pod).
          project=$(ls -d *.xcodeproj | head -n1)
          scheme="${project%.xcodeproj}"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Resolved workspace=$workspace scheme=$scheme"
          echo "All schemes:"
          xcodebuild -workspace "$workspace" -list || true

      - name: Archive unsigned app
        working-directory: rental/mobile/ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration ${{ inputs.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sumu.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package unsigned .ipa
        working-directory: rental/mobile/ios
        run: |
          set -e
          app_path=$(find build/Sumu.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$app_path" ]; then
            echo "No .app in archive; searching derived data..." >&2
            app_path=$(find build -maxdepth 6 -name "*.app" -path "*iphoneos*" | head -n1)
          fi
          if [ -z "$app_path" ]; then
            echo "No .app product found" >&2
            find build -name "*.app" || true
            exit 1
          fi
          echo "Using app: $app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          # Absolute path via $GITHUB_WORKSPACE (the repo root GitHub Actions
          # always sets) rather than a relative ../.. — that relative count
          # was calibrated for the old 1-deep `mobile/ios` layout and quietly
          # started writing one directory short of the root when this
          # workflow moved to the 2-deep `rental/mobile/ios`, which is
          # exactly why the previous run's upload-artifact step found nothing
          # at the root and silently skipped uploading.
          zip -r "$GITHUB_WORKSPACE/sumu-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: sumu-unsigned-ipa
          path: sumu-unsigned.ipa
          retention-days: 14
