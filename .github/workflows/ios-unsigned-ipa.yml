name: ios-unsigned-ipa

# Manual only — builds an UNSIGNED iOS .ipa (no Apple Developer account or
# certificates involved). Download the artifact and sign it with your own
# external signing tool.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          if [ -f Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi

      - name: Resolve workspace and scheme
        id: xc
        working-directory: mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n1)
          scheme=$(xcodebuild -workspace "$workspace" -list \
            | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' \
            | sed -e 's/^[[:space:]]*//' | head -n1)
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Resolved workspace=$workspace scheme=$scheme"

      - name: Build unsigned .app
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration ${{ inputs.configuration }} \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned .ipa
        working-directory: mobile/ios
        run: |
          set -e
          app_path=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$app_path" ]; then
            echo "No .app product found" >&2
            exit 1
          fi
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -r ../../miyar-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: miyar-unsigned-ipa
          path: miyar-unsigned.ipa
          retention-days: 14
